[project]
name = "turfbari-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers --reuse-db"
testpaths = ["apps", "tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"config/settings/*" = ["F405"]
# Local dev tooling: runs the fixed mysqld binary; long usage lines in docstrings.
"**/scripts/*" = ["S603", "S105", "E501"]
# Development-only demo logins, documented in README.md.
"**/management/commands/seed_demo.py" = ["S105"]

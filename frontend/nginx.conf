# TurfBari production Nginx (inside the "web" container).
# TLS is terminated in front of this container (Caddy, Cloudflare, a load balancer or host Nginx),
# which must send X-Forwarded-Proto. Requests arriving without it are treated as plain http.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream turfbari_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Turf photos are up to 10 MB each and several can be sent at once.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Django API and the emergency Django admin.
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://turfbari_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) so the client can't spoof its address in audit logs / lockouts.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploaded pictures (local storage; with S3 configured these URLs point at the bucket instead).
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        # Files are re-encoded images, never executed; refuse anything else.
        location ~* \.(?!webp$|png$|jpe?g$)[^.]+$ { return 404; }
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Vite's hashed bundles never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is the React router's.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

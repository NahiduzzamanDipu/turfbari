<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>Offline · TurfBari</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f5; color: #17352b; }
      main { width: min(30rem, calc(100% - 2rem)); padding: 1.5rem; border: 1px solid #dce6df; border-radius: 1rem; background: #fff; }
      h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
      p { margin: 0; color: #52665d; }
      @media (prefers-color-scheme: dark) { body { background: #101814; color: #eef5ef; } main { background: #19231d; border-color: #34453a; } p { color: #c0cec3; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Connect to the internet and try again. Bookings, payment updates, and slot availability must be checked online.</p>
      <p lang="bn" style="margin-top: .75rem">ইন্টারনেট সংযোগ ফিরলে আবার চেষ্টা করুন। বুকিং ও পেমেন্টের তথ্য অনলাইনে যাচাই করা হয়।</p>
    </main>
  </body>
</html>

<body><h1>TurfBari Bengali promo — storyboard (3:35)</h1><main><figure><img src="../03-reference-images/scene-01/s01-a.png"><figcaption><b>s01-a · 0:00–0:20</b> Hook — where's the pitch?<br><span>কিন্তু মাঠ কোথায়?</span></figcaption></figure><figure><img src="../03-reference-images/scene-01/s01-b.png"><figcaption><b>s01-b · 0:00–0:20</b> Hook — where's the pitch?<br><span>আর টার্ফ মালিকের দিন কাটে খাতা, ফোনকল আর বাকির হিসাব মেলাতে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-02/s02-a.png"><figcaption><b>s02-a · 0:20–0:38</b> Introducing TurfBari<br><span>এই দুই দিকের ঝামেলা সহজ করতেই এসেছে টার্ফবাড়ি।</span></figcaption></figure><figure><img src="../03-reference-images/scene-02/s02-b.png"><figcaption><b>s02-b · 0:20–0:38</b> Introducing TurfBari<br><span>সব এক প্ল্যাটফর্মে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-03/s03-a.png"><figcaption><b>s03-a · 0:38–1:08</b> Public turf discovery<br><span>আপনার সবচেয়ে কাছের টার্ফগুলো আগে দেখাবে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-03/s03-b.png"><figcaption><b>s03-b · 0:38–1:08</b> Public turf discovery<br><span>চাইলে জেলা আর এলাকা বেছে নিন।</span></figcaption></figure><figure><img src="../03-reference-images/scene-03/s03-c.png"><figcaption><b>s03-c · 0:38–1:08</b> Public turf discovery<br><span>দশ জায়গায় ফোন করার দিন শেষ।</span></figcaption></figure><figure><img src="../03-reference-images/scene-04/s04-a.png"><figcaption><b>s04-a · 1:08–1:38</b> Turf details and QR booking<br><span>ছবির গ্যালারি, সুবিধা, খোলার সময় আর ভাড়া।</span></figcaption></figure><figure><img src="../03-reference-images/scene-04/s04-b.png"><figcaption><b>s04-b · 1:08–1:38</b> Turf details and QR booking<br><span>স্ক্যান করলেই খুলে যায় সেই টার্ফের বুকিং পেজ।</span></figcaption></figure><figure><img src="../03-reference-images/scene-04/s04-c.png"><figcaption><b>s04-c · 1:08–1:38</b> Turf details and QR booking<br><span>নাম আর মোবাইল নম্বর দিয়ে পাঠিয়ে দিন বুকিং রিকোয়েস্ট।</span></figcaption></figure><figure><img src="../03-reference-images/scene-04/s04-d.png"><figcaption><b>s04-d · 1:08–1:38</b> Turf details and QR booking<br><span>টার্ফ কর্তৃপক্ষ কনফার্ম করলেই খেলা পাকা।</span></figcaption></figure><figure><img src="../03-reference-images/scene-05/s05-a.png"><figcaption><b>s05-a · 1:38–2:10</b> Turf Owner Dashboard<br><span>আজকের বুকিং, আদায়, মাসের আয় আর বকেয়া—একনজরে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-05/s05-b.png"><figcaption><b>s05-b · 1:38–2:10</b> Turf Owner Dashboard<br><span>কোন সময় খালি, কোনটা বুকড, কোনটা অপেক্ষায়।</span></figcaption></figure><figure><img src="../03-reference-images/scene-05/s05-c.png"><figcaption><b>s05-c · 1:38–2:10</b> Turf Owner Dashboard<br><span>ফোনে আসা বুকিং নিন কয়েক সেকেন্ডেই।</span></figcaption></figure><figure><img src="../03-reference-images/scene-06/s06-a.png"><figcaption><b>s06-a · 2:10–2:35</b> Manager Dashboard<br><span>মালিক যুক্ত করলেই ম্যানেজার পান নিজের লগইন।</span></figcaption></figure><figure><img src="../03-reference-images/scene-06/s06-b.png"><figcaption><b>s06-b · 2:10–2:35</b> Manager Dashboard<br><span>প্রতিদিনের বুকিং, কনফার্ম, পেমেন্ট আর কাস্টমার।</span></figcaption></figure><figure><img src="../03-reference-images/scene-06/s06-c.png"><figcaption><b>s06-c · 2:10–2:35</b> Manager Dashboard<br><span>কাজ ভাগ হয়, নিয়ন্ত্রণ থাকে আপনার।</span></figcaption></figure><figure><img src="../03-reference-images/scene-07/s07-a.png"><figcaption><b>s07-a · 2:35–3:00</b> Payments, reports and insights<br><span>কত টাকা পরিশোধ হয়েছে আর কত বাকি।</span></figcaption></figure><figure><img src="../03-reference-images/scene-07/s07-b.png"><figcaption><b>s07-b · 2:35–3:00</b> Payments, reports and insights<br><span>দরকার হলে এক ক্লিকে এক্সেলে ডাউনলোড।</span></figcaption></figure><figure><img src="../03-reference-images/scene-08/s08-a.png"><figcaption><b>s08-a · 3:00–3:18</b> The overall benefit<br><span>মাঠের বাইরের ঝামেলা কমলে, মাঠের ভেতরের আনন্দটাই বাড়ে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-08/s08-b.png"><figcaption><b>s08-b · 3:00–3:18</b> The overall benefit<br><span>মাঠের ভেতরের আনন্দটাই বাড়ে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-09/s09-a.png"><figcaption><b>s09-a · 3:18–3:35</b> Final branding and call to action<br><span>আজই আপনার টার্ফ যুক্ত করুন টার্ফবাড়িতে।</span></figcaption></figure><figure><img src="../03-reference-images/scene-09/s09-b.png"><figcaption><b>s09-b · 3:18–3:35</b> Final branding and call to action<br><span>টার্ফবাড়ি—প্রতিটি টার্ফের ঠিকানা। খেলা হোক আরও সহজে।</span></figcaption></figure></main></body></html>
